# Saborly Next.js web: nginx reverse proxy (DRAFT, not applied anywhere).
# Runs beside the Flutter site, on its own hostname. Replace next.saborly.es
# with the real one. Do NOT point saborly.es at it until parity sign-off.
#
# Server steps (done by you, on the VPS):
#   cd /var/www/saborly-next && npm ci && npm run build
#   pm2 start npm --name saborly-next -- start -- -p 3010   # port is free of the 3000s used by other apps? check `pm2 ls` / `ss -ltnp`
#   certbot certonly --nginx -d next.saborly.es
#   cp this file to /etc/nginx/sites-available/saborly-next, symlink into sites-enabled
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name next.saborly.es;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name next.saborly.es;

    ssl_certificate     /etc/letsencrypt/live/next.saborly.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next.saborly.es/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # geolocation must stay allowed for self: the branch page's "Use my location" needs it
    # (the Flutter config's geolocation=() would block it).
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    # Next serves hashed build assets; cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/saborly_next_access.log;
    error_log  /var/log/nginx/saborly_next_error.log warn;
}
